
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Weather App</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="weather-container">

        <header>
            <h1>Weather App</h1>
            <p>Check current weather conditions</p>
        </header>

        <form class="search-box" id="searchForm">
            <input
                type="text"
                id="cityInput"
                placeholder="Enter city name..."
                autocomplete="off"
                required
            >
            <button type="submit" id="searchBtn">Search</button>
        </form>

        <p id="message" class="message" aria-live="polite">
            Search for a city to see its weather.
        </p>

        <section class="weather-card" id="weatherCard" hidden>

            <div class="location">
                <h2 id="cityName">City</h2>
                <p id="countryName">Country</p>
            </div>

            <div class="weather-icon">
                <img id="weatherIcon" src="" alt="Weather condition">
            </div>

            <h3 id="temperature">--°C</h3>
            <p id="weatherDescription">Weather condition</p>

            <div class="weather-details">

                <div class="detail-box">
                    <span>Humidity</span>
                    <h4 id="humidity">--%</h4>
                </div>

                <div class="detail-box">
                    <span>Feels Like</span>
                    <h4 id="feelsLike">--°C</h4>
                </div>

            </div>

        </section>


    </div>

    <script src="script.js"></script>
</body>
</html>
